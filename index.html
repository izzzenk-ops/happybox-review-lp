<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>なつのHAPPY BOXレビュー | THE OTOGIBANASHI SUPPLY</title>
<meta property="og:title" content="なつのHAPPY BOXレビュー | THE OTOGIBANASHI SUPPLY">
<meta property="og:description" content="今回詰め込むitemをひと足先に公開してリアルガチレビューを書いてもらいました！">
<meta property="og:image" content="https://izzzenk-ops.github.io/happybox-review-lp/images/hero.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --yellow: #FFFF01;
    --pink: #F5AADF;
    --ink: #1a1a1a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: #ddd300;
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", sans-serif;
    color: var(--ink);
  }
  .lp {
    max-width: 600px;
    margin: 0 auto;
    background: var(--yellow);
    overflow: hidden;
  }
  .lp img { width: 100%; height: auto; display: block; }

  /* ---------- INTRO ---------- */
  .intro {
    padding: 48px 26px 8px;
  }
  .intro h2 {
    font-size: clamp(22px, 6.2vw, 34px);
    font-weight: 800;
    text-align: center;
    letter-spacing: 0.02em;
    white-space: nowrap;
  }
  .intro h2 .melt {
    font-family: "Archivo Black", sans-serif;
    color: var(--pink);
    filter: url(#melt);
  }
  .intro .lead {
    margin-top: 28px;
    font-size: 15.5px;
    font-weight: 700;
    line-height: 2;
  }
  .kenji-says {
    margin: 32px 0 8px;
    font-weight: 800;
    line-height: 1.8;
    text-align: right;
  }
  .kenji-says .s1 { font-size: 17px; }
  .kenji-says .big {
    font-size: clamp(38px, 11vw, 52px);
    letter-spacing: 0.04em;
    line-height: 1.3;
    color: #fff;
    -webkit-text-stroke: 2px var(--ink);
    paint-order: stroke fill;
  }
  .kenji-says .s3 { font-size: 15px; }

  /* ---------- REVIEWS ---------- */
  .reviews { padding: 24px 14px 0; }
  .review-item {
    margin-top: 18px;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 3px 12px rgba(0, 0, 0, 0.12);
  }

  /* ---------- CLOSING ---------- */
  .closing {
    padding: 56px 28px 72px;
    text-align: center;
  }
  .closing .msg {
    font-size: 16px;
    font-weight: 700;
    line-height: 2;
  }
  .cta {
    display: block;
    margin: 30px auto 0;
    max-width: 340px;
    background: var(--ink);
    color: var(--yellow);
    font-size: 18px;
    font-weight: 800;
    text-decoration: none;
    text-align: center;
    padding: 18px 10px;
    border-radius: 999px;
    letter-spacing: 0.05em;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.18);
  }
  .closing .brand-foot {
    margin-top: 48px;
    font-family: "Oswald", sans-serif;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.12em;
  }
</style>
</head>
<body>

<!-- 溶けた文字用のSVGフィルター -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="melt" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.012 0.09" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="10" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<div class="lp">

  <!-- ========== HERO ========== -->
  <img src="images/hero.jpg" alt="なつのHAPPY BOX | THE OTOGIBANASHI SUPPLY" fetchpriority="high">

  <!-- ========== INTRO ========== -->
  <section class="intro">
    <h2>なつの<span class="melt">HAPPY BOX</span>レビュー</h2>
    <p class="lead">
      今回詰め込むitemをひと足先に公開してリアルガチレビューを書いてもらいました！
    </p>
    <div class="kenji-says">
      <p class="s1">正直、、、今回もやりすぎてます😅</p>
      <p class="s1">でも、</p>
      <p class="big">大満足</p>
      <p class="s3">させる気満々です💪</p>
    </div>
  </section>

  <!-- ========== REVIEWS ========== -->
  <section class="reviews">
    <div class="review-item"><img src="images/review-01.jpg" alt="口コミ1" loading="lazy"></div>
    <div class="review-item"><img src="images/review-02.jpg" alt="口コミ2" loading="lazy"></div>
    <div class="review-item"><img src="images/review-03.jpg" alt="口コミ3" loading="lazy"></div>
    <div class="review-item"><img src="images/review-04.jpg" alt="口コミ4" loading="lazy"></div>
    <div class="review-item"><img src="images/review-05.jpg" alt="口コミ5" loading="lazy"></div>
    <div class="review-item"><img src="images/review-06.jpg" alt="口コミ6" loading="lazy"></div>
  </section>

  <!-- ========== CLOSING ========== -->
  <section class="closing">
    <p class="msg">最高のBOXを用意して待ってます🌹<br>お楽しみに！</p>
    <!-- ▼ 購入ページ・予約ページのURLが決まったら href を差し替え -->
    <a class="cta" href="#">HAPPY BOXをチェックする</a>
    <div class="brand-foot">THE OTOGIBANASHI SUPPLY</div>
  </section>

</div>
</body>
</html>
